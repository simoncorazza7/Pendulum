# pendctl configuration. SI units unless the comment says otherwise.
# Values marked PRIOR are not measured yet; the Stage 0 step that measures them is named.
# Override any value on the command line:  pendctl --set key=value

# --- hardware boundary: pendulum encoder
encoder.counts_per_rev = 2400        # counts/rev; PRIOR 600 PPR x4 (verify in 0.6)
encoder.c_bottom = 0                 # counts; hanging equilibrium relative to start (fit in 0.7)
encoder.trim = 0                     # counts; upright-reference trim (refined in Stage 1)

# --- hardware boundary: cart axis
axis.usteps_per_m = 13333.3          # microsteps/m; PRIOR GT2 belt, 60T pulley, 1/8 step (measure in 0.8)
axis.toggles_per_ustep = 2           # STEP toggles per microstep; protocol "steps" are toggles (issue 3, verify in 0.8)

# --- loop and logging
loop.ts = 0.002                      # s; control/sample period
log.dir = logs                       # run directories are created here (relative to the working dir)
log.capacity = 600000                # records; 600000 x 2 ms = 20 min
log.overwrite = false                # true: keep the newest records when full; false: keep the oldest

# --- log-selftest mode (no hardware)
selftest.duration = 5                # s
selftest.freq = 1.5                  # Hz; synthetic sine logged as "value"

# --- real-time settings (need sudo); cores: 0 = everything else, 1 = control loop, 2 = encoder, 3 = step
rt.enable = true                     # SCHED_FIFO + pinning for the loop and the step thread
rt.lock_memory = true                # mlockall(current|future)
rt.loop_prio = 80                    # SCHED_FIFO priority of the control loop
rt.loop_cpu = 1                      # core of the control loop
rt.step_prio = 90                    # SCHED_FIFO priority of the Axis step thread
rt.step_cpu = 3                      # core of the Axis step thread

# --- timing-probe mode (Stage 0.5)
probe.chip = gpiochip2               # must be the gpio-mockup chip unless probe.allow_real_chip = true
probe.allow_real_chip = false        # true only with Simon's go (scope test on probe.step_line)
probe.step_line = 27                 # line offset used as STEP (27 = real STEP; 18 = spare pin for the scope)
probe.profile = accel-stream         # accel-stream | speed | idle
probe.duration = 600                 # s
probe.accel_amp = 160000             # toggles/s^2; accel-stream: a = amp*cos(2 pi f t); peak v = amp/(2 pi f)
probe.accel_freq = 1                 # Hz
probe.speed = 26667                  # toggles/s; speed profile, ~1 m/s nominal (2 toggles/ustep, 13333 usteps/m)
probe.speed_period = 2               # s between direction changes (speed profile)
probe.max_accel = 400000             # toggles/s^2; Axis maxAcceleration for the probe (its cap must not bite)

# --- encoder-log mode (Stage 0.6): inputs only
enc.chip = gpiochip4                 # real chip (gpiochip4 -> gpiochip0); refused unless enc.allow_real_chip = true
enc.allow_real_chip = false          # true only with Simon's go
enc.line_a = 10                      # BCM line of encoder phase A
enc.line_b = 19                      # BCM line of encoder phase B
enc.duration = 120                   # s; Ctrl-C ends earlier and still saves
enc.capacity = 1000000               # events (32 MB); recording 5 (9.5 min of swings) had 0.19 M
rt.enc_prio = 85                     # SCHED_FIFO priority of the encoder reader
rt.enc_cpu = 2                       # core of the encoder reader

# --- identified plant (0.10, 2026-10-09, free decay 40 deg -> 0.5 deg; docs/stage0_6_7_10_results.md)
plant.w0 = 4.931                     # rad/s, hanging small-angle frequency (+-0.01); T0 = 1.274 s, L_eq = 0.4035 m
plant.bJ = 0.024                     # 1/s, viscous pivot friction b/J (from the combined envelope fit)
plant.coulomb = 0.0117               # rad/s^2, Coulomb friction (stiction band +-0.18 counts)
# start-up c_bottom fit (core::fitOffset): small-swing (5-15 deg) damped frequency and decay
calib.swing_w = 4.913                # rad/s, damped frequency of small swings (0.7, 4 swings: 4.906-4.922)
calib.swing_sigma = 0.03             # 1/s, small-swing decay rate (0.7: 0.019-0.055, amplitude dependent)

# --- move mode (Stage 0.8/0.9): point-to-point bring-up moves through hw::PiHw
move.chip = gpiochip2                # gpio-mockup by default; the rig is gpiochip4 (needs move.allow_real_chip)
move.allow_real_chip = false         # true only with Simon's go for that specific run
move.distance = 0.03                 # m, signed; +x = increasing Axis pos while calib.x_sign = 1
move.speed = 0.02                    # m/s
move.accel = 0.1                     # m/s^2
move.dwell = 1.0                     # s at the target (and again back at the start)
move.return = true                   # drive back to the start after the dwell
move.stop_at_switch = false          # true: a closing switch ends the move (switch-position test, 0.8c)
move.allow_start_on_switch = false   # true: may start on a switch, which must release within move.release_within
move.release_within = 0.01           # m; still pressed after this much travel = moving into the end -> abort
move.track_tol = 0.002               # m, |x_ref - x| above this aborts
move.a_brake = 0.5                   # m/s^2, deceleration of an abort or stop
move.kp = 25                         # 1/s^2, tracking gain (position)
move.kv = 10                         # 1/s, tracking gain (velocity)
move.max_distance = 0.35             # m, refuse larger moves (typo guard)
move.max_speed = 0.3                 # m/s, typo guard
move.max_accel = 2.0                 # m/s^2, typo guard
calib.x_sign = 1                     # +1: +x = increasing Axis pos (direction to be established in 0.8)

# --- pins (BCM); defaults = the old hand wiring. The new PCB may change them.
pins.step = 27
pins.dir = 22
pins.en = 24
pins.limit_right = 2
pins.limit_left = 9
pins.ms1 = 20
pins.ms2 = 21
pins.enc_a = 10
pins.enc_b = 19
