# pendctl configuration. SI units unless the comment says otherwise.
# Values marked PRIOR are not measured yet; the Stage 0 step that measures them is named.
# Override any value on the command line:  pendctl --set key=value

# --- hardware boundary: pendulum encoder
encoder.counts_per_rev = 2400        # counts/rev; 600 PPR x4, verified in 0.6 (5 turns = 12000.5 counts)
encoder.c_bottom = 0                 # counts; not read by any mode (each one fits c_bottom at start-up, calib.*)
encoder.trim = 0                     # counts; added to the fitted c_bottom (upright-reference trim). 0 since the new carriage and
                                     # encoder mount (2026-11-02; 15-52-23 balanced 60 s untrimmed). Old mount: -1.6; untrimmed offset over 5
                                     # sessions 10-12..10-14: +2.09 +0.70 +1.98 +1.32 +1.40 (start-to-start scatter ~0.5 counts,
                                     # the start-up calibration); 10-14 mean 1.57 (docs/stage1_demo.md, trim iterations)

# --- hardware boundary: cart axis
axis.usteps_per_m = 13333            # steps/m; 1/8 step (thesis prior). 2026-10-09 13:44: 307 steps -> ~23 mm (ruler).
                                     # STEP MODE IS INTERMITTENT: the same morning 1526 steps spanned the ~0.5 m track
                                     # (half-step, 3072/m). Suspect a loose MS1/MS2 wire. Check the distance before motion runs.
axis.toggles_per_ustep = 2           # STEP toggles per microstep; protocol "steps" are toggles (issue 3, verify in 0.8)

# --- loop and logging
loop.ts = 0.002                      # s; control/sample period
log.dir = logs                       # run directories are created here (relative to the working dir)
log.capacity = 600000                # records; 600000 x 2 ms = 20 min
log.overwrite = false                # true: keep the newest records when full; false: keep the oldest

# --- log-selftest mode (no hardware)
selftest.duration = 5                # s
selftest.freq = 1.5                  # Hz; synthetic sine logged as "value"

# --- real-time settings (need sudo); cores: 0 = everything else, 1 = control loop, 2 = encoder, 3 = step
rt.enable = true                     # SCHED_FIFO + pinning for the loop and the step thread
rt.lock_memory = true                # mlockall(current|future)
rt.loop_prio = 80                    # SCHED_FIFO priority of the control loop
rt.loop_cpu = 1                      # core of the control loop
rt.step_prio = 90                    # SCHED_FIFO priority of the Axis step thread
rt.step_cpu = 3                      # core of the Axis step thread

# --- timing-probe mode (Stage 0.5)
probe.chip = gpiochip2               # must be the gpio-mockup chip unless probe.allow_real_chip = true
probe.allow_real_chip = false        # true only for a deliberate scope test on probe.step_line
probe.step_line = 27                 # line offset used as STEP (27 = real STEP; 18 = spare pin for the scope)
probe.profile = accel-stream         # accel-stream | speed | idle
probe.duration = 600                 # s
probe.accel_amp = 160000             # toggles/s^2; accel-stream: a = amp*cos(2 pi f t); peak v = amp/(2 pi f)
probe.accel_freq = 1                 # Hz
probe.speed = 26667                  # toggles/s; speed profile, ~1 m/s nominal (2 toggles/ustep, 13333 usteps/m)
probe.speed_period = 2               # s between direction changes (speed profile)
probe.max_accel = 400000             # toggles/s^2; Axis maxAcceleration for the probe (its cap must not bite)

# --- encoder-log mode (Stage 0.6): inputs only
enc.chip = gpiochip4                 # real chip (gpiochip4 -> gpiochip0); refused unless enc.allow_real_chip = true
enc.allow_real_chip = false          # true only for a deliberate recording on the real rig
enc.line_a = 10                      # BCM line of encoder phase A
enc.line_b = 19                      # BCM line of encoder phase B
enc.duration = 120                   # s; Ctrl-C ends earlier and still saves
enc.capacity = 1000000               # events (32 MB); recording 5 (9.5 min of swings) had 0.19 M
rt.enc_prio = 85                     # SCHED_FIFO priority of the encoder reader
rt.enc_cpu = 2                       # core of the encoder reader

# --- identified plant (2026-11-02, new carriage + external support bearing on the encoder shaft, after the friction fix:
#     logs/2026-11-02T15-43-11_encoder-log, py/fit_swing.py --t0 2 --t1 29, free decay 43 deg -> 1.9 deg in ~27 s).
#     Old pivot (0.10, 2026-10-09): w0 4.931, bJ 0.024, coulomb 0.0117 (docs/stage0_6_7_10_results.md).
plant.w0 = 4.97                      # rad/s, hanging small-angle frequency; T0 = 1.264 s, L_eq = 0.397 m
plant.bJ = 0.054                     # 1/s, viscous pivot friction b/J (combined envelope fit; old pivot 0.024)
plant.coulomb = 0.168                # rad/s^2, Coulomb friction (stiction band +-2.6 counts; old pivot 0.0117, 14x less)
# start-up c_bottom fit (core::fitOffset): frequency plant.w0 (1 - A^2/16) for amplitude A, and decay
calib.swing_sigma = 0.12             # 1/s, effective decay rate for the 3 s fit window. The decay is now mostly Coulomb (linear),
                                     # so this matches 12-18 deg swings (replay of 15-43-11: accepted, c within 0.3 counts); 3-8 deg
                                     # swings die too fast and are rejected. Old pivot: 0.03

# --- move mode (Stage 0.8/0.9): point-to-point bring-up moves through hw::PiHw
move.chip = gpiochip2                # gpio-mockup by default; the rig is gpiochip4 (needs move.allow_real_chip)
move.allow_real_chip = false         # true only for a deliberate run on the real rig
move.distance = 0.03                 # m, signed; +x = increasing Axis pos while calib.x_sign = 1
move.speed = 0.02                    # m/s
move.accel = 0.1                     # m/s^2
move.dwell = 1.0                     # s at the target (and again back at the start)
move.return = true                   # drive back to the start after the dwell
move.stop_at_switch = false          # true: a closing switch ends the move (switch-position test, 0.8c)
move.allow_start_on_switch = false   # true: may start on a switch, which must release within move.release_within
move.release_within = 0.01           # m; still pressed after this much travel = moving into the end -> abort
move.track_tol = 0.002               # m, |x_ref - x| above this aborts
move.a_brake = 0.5                   # m/s^2, deceleration of an abort or stop
move.kp = 25                         # 1/s^2, tracking gain (position)
move.kv = 10                         # 1/s, tracking gain (velocity)
move.max_distance = 0.35             # m, refuse larger moves (typo guard)
move.max_speed = 0.3                 # m/s, typo guard
move.max_accel = 2.0                 # m/s^2, typo guard
calib.x_sign = 1                     # +1: +x = increasing Axis pos = toward the LEFT switch (0.8, 2026-10-09)
calib.theta_sign = 1                 # +1: increasing counts = increasing theta. Hand test 2026-10-09: bob pushed
                                     # toward +x (theta falls from pi) lowered the counts by 228. To be confirmed
                                     # end to end by the 0.10 pulse test before any balancing.

# --- pins (BCM); defaults = the old hand wiring. The new PCB may change them.
pins.step = 27
pins.dir = 22
pins.en = 24
pins.limit_right = 2
pins.limit_left = 9
pins.ms1 = 20
pins.ms2 = 21
pins.enc_a = 10
pins.enc_b = 19

# --- Axis caps for the pendctl motion modes (damp, later balance)
axis.max_accel = 400000              # toggles/s^2; Axis maxAcceleration (15 m/s^2 at 13333 usteps/m: its cap must not bite)
axis.max_speed = 120000              # toggles/s; Axis default maxSpeed (4.5 m/s at 13333 usteps/m), not changed by pendctl

# --- start-up calibration (shadow, damp, balance): c_bottom from a small free swing (core::fitOffset).
# The encoder has no index, so this runs at every program start (docs/stage0_7_0_10_fits.md).
calib.window = 3.0                   # s of edges per fit (~2.3 periods)
calib.amp_min_deg = 2                # deg; smaller swings are rejected
calib.amp_max_deg = 20               # deg; larger swings are rejected (amplitude-corrected w: c within ~0.13 counts)
calib.rms_max = 2.0                  # counts; free decay <= 1.2 up to 20 deg; hand contact gave 7-27 (2026-10-09)
calib.se_max = 0.05                  # counts; standard error of c_bottom
calib.agree = 0.2                    # counts; two consecutive fits (0.5 s apart) must agree
calib.timeout = 120                  # s; no accepted fit by then -> exit without motion

# --- Stage 1 controller: pole placement from plant.* (docs/model_derivation.md). Limits PRIOR until 0.9/Gate B.
ctrl.wc_over_w0 = 2.0                # closed-loop bandwidth wc / w0 (brief: 1.5-3)
ctrl.zeta = 0.7                      # damping of the dominant pole pair; kept 2026-10-14 (min peak sensitivity, Gate B appendix)
ctrl.p_over_w0 = 0.5                 # integral pole p / w0 (0 = PD)
ctrl.a_max = 3.0                     # m/s^2; PRIOR (0.9 sets it to 50-70 % of the reliable maximum)
ctrl.v_max = 0.5                     # m/s; PRIOR (0.9)
ctrl.v_taper = 0.25                  # fraction of v_max over which the authority toward v_max tapers to 0
ctrl.i_max = 1.0                     # m/s^2; clamp of |ki * integral|
ctrl.i_delay = 0                     # s before the integrator runs. 0: every bit of int theta it misses stays as
                                     # cart velocity (0.1 s cost 42 mm/s after a 3 deg catch; docs/stage1_drift.md)
ctrl.preload = true                  # pre-load the integrator with theta'/w0^2 at engage (needs sup.engage_on_release)
ctrl.estimator = bdlp2               # bdlp1 | bdlp2. 0.11 on real data (docs/stage0_11_estimators.md): LP2 20 Hz
ctrl.est_fc = 14                     # Hz; BD+LP2 cut-off. 20 Hz (0.11) let a ~28 Hz drive-side mode grow in 3 of 17 rig
                                     # runs; 14 Hz: 0 of 7, 45 % less loop gain at 28 Hz, PM 46 deg, DM 43 ms (py/fc_study.py)
ctrl.delay_samples = 0               # Stage 2a delay line on the controller output
# Stage 3 cascade (docs/stage3_cascade.md, py/cascade_study.py, 2026-11-03): an outer cart loop sets the angle
# reference, theta_ref = clamp((-cart_kx x - cart_kv v) / g, +-cart_theta_max). Slow on purpose: w_x 0.5 rad/s,
# zeta 1 (kx = w_x^2, kv = 2 zeta w_x), far below the angle loop (~10 rad/s) and its non-minimum-phase zero at w0.
# Sim, 13 cases (rig hand-overs, hand releases, +-1 count trim, remote 6 ticks): 12/13 kept 30 s (angle only: 0/13),
# max |x| 114 mm, RMS theta 0.15 deg; faster outer loops swayed or ran out of track. 0 and 0 = angle only (Stage 1).
# Stage 3b (2026-11-04, py/cascade_pi_study.py): the rig's reference error of ~1.3 counts parked the P loop at
# g delta / kx = 0.13 m (every run ended at the +x soft limit). An integral removes it: gains from
# (s^2 + 2 zeta w s + w^2)(s + p), w 0.5, zeta 0.8, p 0.2 -> kx = w^2 + 2 zeta w p, kv = 2 zeta w + p, ki = w^2 p.
# 29 rig hand-overs at 1.3 counts: 20/29 kept 30 s (P loop 2/29); every loss within 1.2 s = the catch kick (gate below).
ctrl.cart_kx = 0.41                  # 1/s^2 (Stage 3, P only: 0.25)
ctrl.cart_kv = 1.0                   # 1/s
ctrl.cart_theta_max_deg = 4          # deg, clamp of the outer loop's lean
ctrl.cart_ki = 0.05                  # 1/s^3; integrates only inside the clamp; reset at each catch. 0 = Stage 3 P loop
ctrl.cart_i_max_deg = 2              # deg, clamp of the integral's lean (a 1.3-count error needs 0.2 deg)

# --- supervisor (brief §6)
sup.theta_engage_deg = 4             # deg; engage when |theta| is below this ...
sup.omega_engage = 0.5               # rad/s; ... and |omega| below this ...
sup.engage_samples = 25              # ... for this many consecutive samples (50 ms)
sup.theta_abort_deg = 22             # deg
sup.x_min = -0.15                    # m; soft limits about the start position (cart centred at start, switches ~+-0.25 m)
sup.x_max = 0.15                     # m
sup.a_brake = 1.0                    # m/s^2; controlled-stop deceleration; PRIOR (0.9)
sup.t_react = 0.006                  # s; reaction time added to the braking distance
sup.brake_margin = 0.01              # m
sup.overrun_streak = 3               # consecutive loop overruns -> abort
sup.max_run_time = 60                # s engaged
sup.v_stopped = 0.005                # m/s; standstill threshold
sup.stop_timeout = 2.0               # s in STOPPING before giving up (then HALT)
sup.hang_tol_deg = 10                # deg from hanging, to arm
sup.omega_hang = 0.3                 # rad/s, to arm
sup.center_tol = 0.02                # m from the start position, to arm
sup.engage_on_release = false        # OFF until validated: engage only when the pendulum moves freely (docs/stage1_drift.md).
                                     # Shadow 14-38-54: hand adjustments near upright looked like releases (false engages).
sup.release_edges = 6                # newest edges that must all step away from upright and fit free motion
sup.release_span = 0.15              # s they must span (a free fall separates from a hand only over ~1/w0)
sup.release_rms = 0.35               # counts, residual of the free-motion fit (theta = A e^{w0 t} + B e^{-w0 t})
sup.release_omega_min = 0.06         # rad/s, fitted speed (hand creep in the shadow runs: 0.01-0.02)
sup.release_fresh = 0.1              # s; the newest release edge must be this recent

# --- shadow mode (Stage 1 step 1): encoder + limit switches only. The motor lines are never requested.
shadow.chip = gpiochip2              # gpio-mockup by default; the rig is gpiochip4 (needs shadow.allow_real_chip)
shadow.allow_real_chip = false       # true only for a deliberate run on the real sensors
shadow.duration = 300                # s; Ctrl-C ends earlier and still saves
shadow.status_period = 0.5           # s between status lines

# --- damp mode (Stage 1 step 2): hanging active damping a = -gain * phi' (docs/stage1_damp.md)
damp.chip = gpiochip2                # gpio-mockup by default; the rig is gpiochip4 (needs damp.allow_real_chip)
damp.allow_real_chip = false         # true only for a deliberate run on the real rig
damp.zeta = 0.2                      # target damping ratio of the hanging swing (open loop 0.0024)
damp.a_max = 1.0                     # m/s^2; command saturation
damp.engage_omega_min = 0.15         # rad/s at the zero crossing (swing amplitude >= ~1.7 deg)
damp.duration = 5                    # s engaged (amplitude falls to e^-(zeta w0 5) = 0.7 %), then stop
damp.wait_max = 20                   # s without a zero crossing -> exit, no motion
damp.phi_abort_deg = 25              # deg from hanging (a growing swing means a sign error)
damp.v_abort = 0.3                   # m/s
damp.x_limit = 0.10                  # m; soft limit about the start position, with braking distance
damp.a_brake = 1.0                   # m/s^2

# --- balance session (Stage 1 hardware step 3: first closed-loop catches; docs/stage1_demo.md). HARDWARE ACTION.
# Calibrate (driver off) -> on Enter: home (right switch, left switch: span = step-mode check; centre) ->
# balance (arms by itself when the pendulum hangs still) -> after each run, on Enter: touch the nearer
# switch (step-loss audit) and re-centre. Moves accelerate for exactly one pendulum period (no residual swing).
balance.chip = gpiochip2             # gpio-mockup by default; the rig is gpiochip4 (needs balance.allow_real_chip)
balance.allow_real_chip = false      # true only via ./demo.sh, ./remote.sh, ./swingup.sh (set after their checklist)
balance.a_max = 2.0                  # m/s^2; replaces ctrl.a_max in this mode (brief: reduced limits for the first catches)
balance.v_max = 0.3                  # m/s; replaces ctrl.v_max in this mode
balance.v_seek = 0.04                # m/s toward a switch (if the step mode were half step: 0.16 m/s, ~3 mm past the switch)
balance.v_travel = 0.10              # m/s, other session moves
balance.move_a_max = 0.3             # m/s^2, cap on move accelerations (the shaped profiles use v/T0 = 0.08 or less)
balance.a_brake = 1.0                # m/s^2, stop at a switch and on move aborts
balance.seek_max = 0.55              # m; the first seek (right switch) gives up after this (track ~0.46 m)
balance.span_usteps = 6104           # usteps between the switches at 1/8 step = 4 x 1526 measured at half step (0.8c, 2026-10-09)
balance.span_tol = 0.05              # fraction (+-305 usteps); half step 1526, quarter 3052, 1/16 12208 all fail
balance.approach = 0.03              # m; re-centring travels at v_travel to this far before the switch, then seeks
balance.touch_tol = 0.015            # m; the switch found further than this from where the step count says -> stop
balance.log_seconds = 900            # s of ticks kept in data.csv (the newest)
balance.max_session = 3600           # s; then the session quits by itself
balance.status_period = 0.5          # s between status lines while ENGAGED

# --- swing-up (energy pumping + hand-over; brief Stage 4, pulled forward on 2026-10-14; docs/swingup_notes.md)
# Used by the balance session when balance.swingup = true (./swingup.sh). HARDWARE ACTION: the pendulum sweeps the
# whole circle around the pivot; the cart swings ~+-60-100 mm for ~15-25 s.
balance.swingup = false              # true: after homing / re-centring, Enter starts a swing-up instead of a hand catch
swingup.a_pump = 1.1                 # m/s^2, cap of the pumping term (cart swing ~ +-52 mm per m/s^2; py/swingup_study.py).
                                     # 0.75 stalled at 0.84-0.92 of upright with the 11-02 pivot friction (09-44-23: input ~0.09/s vs
                                     # loss ~0.08/s); 1.1 reaches the top in 17-21 s, cart -81..+95 mm (10-02-18)
swingup.a_damp = 0.5                 # m/s^2, cap of the energy-removal term
swingup.k_e = 2.0                    # (m/s^2)/(rad^2/s^2); bang-bang until E is within ~1.1 % of the target (friction stalls the
                                     # fade-out below the target; arrival ~0.5-1 % under e_ref at 2.0)
swingup.e_ref = 0.01                 # fraction of 2 w0^2 above upright. 2026-11-03: 0.02 arrived at 0.99-1.015 (over the top);
                                     # 0.01 at 1.0008-1.0048, 6/6 handed over (10-02-18). Old pivot: 0.007 (11-36-43)
swingup.e_abort = 0.10               # fraction above upright: too much energy -> remove it
swingup.kx = 4.0                     # 1/s^2, cart centring while pumping / removing energy (2 rad/s, below w0)
swingup.kv = 2.8                     # 1/s
swingup.kick_time = 0.25             # s at +a_pump to start the swing from rest
swingup.theta_sw_deg = 10            # deg, hand-over window |theta| ...
swingup.u_sw_deg = 5                 # deg, ... and |theta + theta'/w0|. 10-02-18: hand-overs at u 1.3-3.8 deg, 6/6; what decided the
                                     # balance time was the cart at hand-over (+52 mm, +190 mm/s -> 0.35 s; near 0 -> 30 s), not u.
                                     # 10-14 (old pivot, py/catch_study.py): each deg of u costs ~35 mm/s of cart speed
swingup.pump_max = 60                # s without a hand-over -> remove energy (a slow approach comes round again)
swingup.v_sw = 0.07                  # m/s, hand over only if the cart speed predicted after the catch,
                                     # |v + (g/w0)(theta + theta'/w0)|, is below this (0 = off). Rig 11-03/04, 29 hand-overs:
                                     # every balance >= 8 s had |v_pred| <= 62 mm/s; every one above 90 mm/s ended within 2 s.
swingup.balance_max = 30             # s balanced -> brake, remove energy (normal end if the soft limit doesn't come first)
swingup.damp_max = 25                # s of energy removal, then a plain stop
swingup.quiet_deg = 10               # deg, swing amplitude that ends the energy removal
swingup.preload = true               # integrator pre-load theta'/w0^2 at the hand-over

# --- remote controller (brief Stage 2b, added 2026-10-19; docs/remote.md)
# balance.remote = true (./remote.sh): the PC runs the controller (py/remote_ctrl.py) on the samples the Pi streams
# over UDP; the Pi applies the PC's command from the sample remote.delay_ticks ticks ago (constant delay) and keeps
# everything else local (supervisor, limits, homing, operator keys). The local PID runs as a shadow for comparison.
balance.remote = false               # true only via ./remote.sh (or --set): hand catches with the PC's controller
remote.port = 9760                   # UDP port the Pi listens on; the PC sends HELLO there and gets samples back
remote.delay_ticks = 4               # ticks of loop.ts: the constant command delay. Choose it from the measured round
                                     # trip on the PC you use (py/net_probe_pi.py + py/net_probe_pc.py, py/remote_report.py):
                                     # worst round trip + margin, rounded up to whole ticks. PID delay margin ~43 ms.
                                     # Wired PC 2026-11-03: 14-14-50_remote-sim (1.4 min) max 4.17 ms suggested 4, but the first
                                     # rig session 14-32-03_balance (5.8 min, 172 907 replies, 0 lost) had clustered stalls to
                                     # 13.2 ms: at 4, 8 late / runs of 3 held ticks (abort at 5); at 6, 2 late, single ticks
                                     # (12 ms, PM 46 -> 34 deg); 7 covers all (32 deg). Wi-Fi (10-19 probe) needed 7.
                                     # 2026-11-04 back to 4 (8 ms, PM 38 deg): 09-20-36 (146k replies) had one
                                     # stall of 14.3 ms -> 7 late at 4 ticks, longest run 4 (remote.max_miss aborts at 5).
remote.max_miss = 5                  # consecutive ENGAGED ticks without the command (each holds the previous) -> abort
remote.link_timeout = 0.1            # s without a reply (with the current params) -> link down: arm refused / abort
remote.sim_seconds = 30              # pendctl --mode remote-sim (simulated pendulum, no GPIO): s balanced, then stop
remote.sim_tap_period = 5            # s between simulated taps on the rod (0 = none)
remote.sim_tap_deg = 1               # deg, push size (the hand moves the rod this far in 0.1 s, holds, lets go)
remote.sim_wait_pc = 120             # s to wait for the PC before giving up

# --- PCB bring-up test (pendctl --mode pcb-test via ./pcbtest.sh C|D|E; docs/pcb_bringup.md). Board: pcb/ (2026-10-06)
pcbtest.chip = gpiochip2             # gpio-mockup by default; the rig is gpiochip4 (needs pcbtest.allow_real_chip)
pcbtest.allow_real_chip = false      # true only via ./pcbtest.sh (after its checklist)
pcbtest.stage = C                    # C: GPIO shorts/bridges + supply (nothing plugged in) | D: switches + encoder | E: motor
pcbtest.load_seconds = 30            # s of full CPU load for the supply check (stage C)
pcbtest.v_slow = 0.010               # m/s, approach to the switches and the step-mode trips (<= 0.02 enforced)
pcbtest.v_span = 0.020               # m/s, the switch-to-switch run (<= 0.03 enforced)
pcbtest.seek_max = 0.55              # m, a switch not found within this stops the test (track ~0.46 m)
pcbtest.dir_test = 0.010             # m, the direction check move (stage E2)
pcbtest.backoff = 0.005              # m beyond the switch's release point before each step-mode trip
pcbtest.trial_usteps = 200           # eighth-steps per step-mode trip (15 mm at 13333/m; full step = 25 pulses)
pcbtest.hold_seconds = 5             # s the driver is enabled for the holding-torque check (stage E1)
pcbtest.require_stage_d = true       # stage E only after a passed stage D (the switches stop every move)

# --- actuator test (Stage 0.9: pendctl --mode actuator via ./actuator.sh; docs/stage0_9_actuator.md). HARDWARE ACTION.
# Homes like the balance session, then runs a ladder of rungs (v, a) with the hanging pendulum mounted, touching a
# switch after every rep (step-loss audit). Homing, travel and touches use balance.* (v_seek, v_travel, span,
# approach, touch_tol, move_a_max, a_brake) and move.kp / kv / track_tol / release_within.
actuator.chip = gpiochip2            # gpio-mockup by default; the rig is gpiochip4 (needs actuator.allow_real_chip)
actuator.allow_real_chip = false     # true only via ./actuator.sh (after its checklist)
actuator.profile = pair              # pair | oneway | bang | chirp | table
actuator.speeds = 0.3                # m/s, comma list, one ladder per speed (blocks B1-B4 run one speed each)
actuator.accels = 2,3,4,5,6,8,10     # m/s^2, comma list, ascending: the ladder
actuator.reps = 2                    # reps per rung (B5 confirmation: 5)
actuator.cruise = 0.10               # s of cruise per pair / oneway leg
actuator.leg_max = 0.30              # m, longest leg; legs are centred, so |x| <= 0.15 m
actuator.v_top = 0.8                 # m/s, faster rungs are refused (typo guard)
actuator.a_top = 10                  # m/s^2, harder rungs are refused (typo guard; Axis cap 12.3 m/s^2 at 0.8 m/s)
actuator.a_margin = 1.1              # the command is limited to a_margin x the rung's acceleration
actuator.track_tol = 0.003           # m, |x_ref - x| (Axis step count) above this aborts a run
actuator.touch_pass = 3              # usteps: |touch error| up to this passes a rep (22 audits 11-03/04: <= 2)
actuator.touch_fail = 8              # usteps (one full step): this or more fails the rep and ends that speed's ladder
actuator.settle_deg = 3              # deg, swing amplitude of the hanging pendulum below which a rep starts
actuator.settle_max = 40             # s, then the rep starts anyway (flagged in the results)
actuator.stream_seconds = 10         # s, profiles bang and chirp
actuator.stream_x_max = 0.10         # m, peak |x| of a bang or chirp
actuator.chirp_f1 = 40               # Hz, end of the chirp sweep
actuator.chirp_taper = 1.0           # s, cosine ramp at each end of the chirp
actuator.table =                     # profile table: CSV t,x,v,a every loop.ts (py/actuator_replay.py)
actuator.vref = 0                    # V, the A4988's Vref as measured (0 = not entered); recorded in meta.json
